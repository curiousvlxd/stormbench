[project]
name = "stormbench-sim"
version = "0.1.0"
description = "StormBench simulator: the SWMM side of the test bench for sewer control code"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyswmm==2.1.0",
    "swmm-toolkit==0.17.0",
    "pymodbus>=3.15,<4",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.5",
    "paho-mqtt>=2.1,<2.2",
    "protobuf>=7.35.1,<8",
    "scipy>=1.14",
    "pillow>=10",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
stormbench-sim = "stormbench_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stormbench_sim"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["stormbench_sim/sparkplug/sparkplug_b_pb2.py"]  # generated by protoc (make proto-py)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the Astlingen model files (python models/fetch_astlingen.py)",
    "plc: needs a running PLC (set PLC_HOST, optionally PLC_PORT)",
    "uns: needs the Phase 2 stack: PLC, edge gateway, broker and Scada (set UNS_PLC_HOST)",
]
