version = 1
SPDX-PackageName = "stormbench"
SPDX-PackageDownloadLocation = "https://github.com/"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 StormBench contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.md", "docs/**", "results/**", "src/StormBench.Scada/wwwroot/benchmarks/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 StormBench contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["fonts/AtkinsonHyperlegibleNext-*", "fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "fonts/SourceSans3-*"
precedence = "override"
SPDX-FileCopyrightText = "2010-2020 Adobe"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/StormBench.Sparkplug/Protos/sparkplug_b.proto"
precedence = "override"
SPDX-FileCopyrightText = "2015, 2018 Cirrus Link Solutions and others"
SPDX-License-Identifier = "EPL-2.0"

[[annotations]]
path = "simulator/stormbench_sim/sparkplug/sparkplug_b_pb2.py"
precedence = "override"
SPDX-FileCopyrightText = "2015, 2018 Cirrus Link Solutions and others"
SPDX-License-Identifier = "EPL-2.0"

[[annotations]]
path = "src/StormBench.Scada/wwwroot/live/kenney/**"
precedence = "override"
SPDX-FileCopyrightText = "Kenney (www.kenney.nl)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "src/StormBench.Scada/wwwroot/live/assets/waternormals.jpg"
precedence = "override"
SPDX-FileCopyrightText = "2010-2025 three.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["assets/models/stormbench.blend", "src/StormBench.Scada/wwwroot/live/models/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 StormBench contributors", "Kenney (www.kenney.nl)"]
SPDX-License-Identifier = "CC-BY-4.0 AND CC0-1.0"
